<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>
  
  <!-- Sparkles -->
  <circle cx="40" cy="40" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="160" cy="50" r="2.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="170" cy="140" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="30" cy="150" r="2.5" fill="#fbbf24" opacity="0.5"/>
  
  <!-- Hair styling tools (simplified) -->
  <g transform="translate(100, 100)">
    <!-- Brush icon -->
    <rect x="-35" y="-15" width="8" height="30" fill="#ec4899" rx="2"/>
    <circle cx="-31" cy="20" r="6" fill="#8b5cf6"/>
    
    <!-- Curling iron -->
    <path d="M 20 -20 Q 25 -10 20 0 Q 15 10 20 20" stroke="#a855f7" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="18" y="-25" width="4" height="8" fill="#6366f1" rx="1"/>
  </g>
  
  <!-- Simplified face silhouette -->
  <circle cx="100" cy="95" r="45" fill="rgba(255,255,255,0.15)"/>
  <ellipse cx="85" cy="85" rx="6" ry="8" fill="rgba(255,255,255,0.3)"/>
  <ellipse cx="115" cy="85" rx="6" ry="8" fill="rgba(255,255,255,0.3)"/>
</svg>
