
services:
  postgres:
    image: postgres:15-alpine
    container_name: aifacebot_postgres
    environment:
      POSTGRES_DB: aifacebot
      POSTGRES_USER: aifacebot_user
      POSTGRES_PASSWORD: aifacebot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aifacebot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifacebot_user -d aifacebot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aifacebot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aifacebot_network
    command: redis-server --appendonly yes

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aifacebot_bot
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://aifacebot_user:aifacebot_password@postgres:5432/aifacebot?sslmode=disable"
      REDIS_URL: redis:6379
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      WEB_BACKEND_URL: http://web-backend:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      web-backend:
        condition: service_started
    networks:
      - aifacebot_network
    restart: unless-stopped

  web-backend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: aifacebot_web_backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://aifacebot_user:aifacebot_password@postgres:5432/aifacebot?sslmode=disable"
      REDIS_URL: redis:6379
      WEB_SERVER_HOST: 0.0.0.0
      WEB_SERVER_PORT: 3000
      FRONTEND_URL: https://app.aifaceapp.ru
      ENVIRONMENT: production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-https://app.aifaceapp.ru/api/auth/google/callback}
      KIEAPI_API_KEY: ${KIEAPI_API_KEY:-}
      KIEAPI_BASE_URL: ${KIEAPI_BASE_URL:-https://api.kie.ai}
      WEB_KIEAPI_CALLBACK_URL: ${WEB_KIEAPI_CALLBACK_URL:-https://app.aifaceapp.ru/api/callbacks/kieapi}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-https://app.aifaceapp.ru/payments}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aifacebot_network
    restart: unless-stopped

  web-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aifacebot_web_frontend
    ports:
      - "127.0.0.1:8081:80"
    environment:
      VITE_API_URL: /api
      VITE_TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-aifaceappbot}
    depends_on:
      - web-backend
    networks:
      - aifacebot_network
    restart: unless-stopped

  migrate-generations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aifacebot_migrate_generations
    working_dir: /app/cmd/migrate-generations
    command: go run main.go -host=postgres -port=5432 -user=aifacebot_user -password=aifacebot_password -db=aifacebot -dry-run=true
    environment:
      DATABASE_URL: "postgres://aifacebot_user:aifacebot_password@postgres:5432/aifacebot?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aifacebot_network
    profiles:
      - migrate

volumes:
  postgres_data:
  redis_data:

networks:
  aifacebot_network:
    driver: bridge
